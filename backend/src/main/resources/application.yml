server:
  port: 8080

spring:
  application:
    name: obliterate-harness
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      # archives (POST /api/import) can be large
      max-file-size: 200MB
      max-request-size: 200MB
  datasource:
    url: ${PG_URL:jdbc:postgresql://localhost:5432/harness}
    username: ${PG_USER:harness}
    password: ${PG_PASSWORD:harness}
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USER:neo4j}
      password: ${NEO4J_PASSWORD:harness-dev}
  ai:
    mcp:
      server:
        name: obliterate-harness
        version: 0.1.0
        type: SYNC
        protocol: STREAMABLE
        streamable-http:
          mcp-endpoint: /mcp
        instructions: |
          Obliterate Harness: a graph "brain" that runs several contexts (domains): stories and worlds, a company's internal knowledge
          (teams, clients, contracts, pricing, products, business rules, integrations, documents) and any context people define.
          The graph is the source of truth. Operating contract:
          0) Find where to work: context_list → project_list(contextId). Each context brings its own types, rules and instructions.
          1) ALWAYS start with session_begin (or session_resume if you lost context) and read the briefing (it includes the context's instructions). Write in the project's locale (en or pt).
          2) Read only the context you need (writing_context to write a unit; node_search, node_get, graph_focus, state_at, facts_list); do not load everything.
          3) Foundational/critical facts are rules: law must never be broken; norm only with a narrative reason. Secrets (revealAt) must not leak early.
          4) Do not invent facts about the work that the user has not confirmed: ask.
          5) All writes go through propose_changes in coherent batches (dryRun to check first); search for duplicates before creating; update/delete with expectedVersion. Prose goes through unit_text_set/unit_text_append.
          6) session_checkpoint at the end of each step.
          Full manual in the resource harness://manual (Portuguese: harness://manual/pt).

harness:
  timezone: ${HARNESS_TIMEZONE:UTC}
  public-url: ${HARNESS_PUBLIC_URL:http://localhost:8180}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.neo4j.driver: WARN
