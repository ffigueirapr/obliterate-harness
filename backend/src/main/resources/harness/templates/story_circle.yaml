id: story_circle
name: Story Circle
description: { en: "Eight steps in a circle: need, crossing, search, finding, price, return and change.", pt: "Oito passos em círculo: necessidade, travessia, busca, conquista, preço, retorno e mudança." }
scope: obra
media: [filme_serie, livro, jogo]
source: { en: "Dan Harmon, Story Circle (derived from the hero's journey)", pt: "Dan Harmon, Story Circle (derivado da jornada do herói)" }
beats:
  - { key: { en: you, pt: voce }, name: { en: 1. Comfort zone, pt: 1. Zona de conforto }, position: 0.0,
      function: { en: "A character in their comfort zone.", pt: "Um personagem em sua zona de conforto." }, criteria: { en: "Shows who they are and where they are.", pt: "Mostra quem ele é e onde está." } }
  - { key: { en: need, pt: necessidade }, name: { en: 2. Need, pt: 2. Necessidade }, position: 0.14,
      function: { en: "They want or need something.", pt: "Ele quer ou precisa de algo." }, criteria: { en: "Desire or lack is explicit.", pt: "Desejo ou falta fica explícito." } }
  - { key: { en: go, pt: ir }, name: { en: 3. Go, pt: 3. Ir }, position: 0.28,
      function: { en: "They enter an unfamiliar situation.", pt: "Entra numa situação desconhecida." }, criteria: { en: "Crosses into new territory.", pt: "Atravessa para um território novo." } }
  - { key: { en: search, pt: busca }, name: { en: 4. Search, pt: 4. Busca }, position: 0.42,
      function: { en: "They adapt, suffer, learn.", pt: "Adapta-se, sofre, aprende." }, criteria: { en: "Obstacles and adaptation to the new.", pt: "Obstáculos e adaptação ao novo." } }
  - { key: { en: find, pt: encontra }, name: { en: 5. Find, pt: 5. Encontra }, position: 0.57,
      function: { en: "They get what they wanted.", pt: "Consegue o que queria." }, criteria: { en: "A concrete win of the desire.", pt: "Conquista concreta do desejo." } }
  - { key: { en: take, pt: paga }, name: { en: 6. Pay the price, pt: 6. Paga o preço }, position: 0.71,
      function: { en: "The gain costs a lot.", pt: "O ganho cobra um custo alto." }, criteria: { en: "Loss or heavy consequence of the win.", pt: "Perda ou consequência pesada da conquista." } }
  - { key: { en: return, pt: volta }, name: { en: 7. Return, pt: 7. Volta }, position: 0.85,
      function: { en: "They go back to the familiar situation.", pt: "Retorna à situação conhecida." }, criteria: { en: "A movement back to the starting point.", pt: "Movimento de volta ao ponto de partida." } }
  - { key: { en: change, pt: muda }, name: { en: 8. Changed, pt: 8. Mudou }, position: 1.0,
      function: { en: "They return transformed.", pt: "Volta transformado." }, criteria: { en: "The change is visible in action, not just stated.", pt: "A mudança é visível na ação, não só dita." } }
