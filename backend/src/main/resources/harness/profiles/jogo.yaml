id: jogo
name: { en: Video game, pt: Jogo (videogame) }
description: { en: "Game script: acts, levels, quests, encounters and dialogues, with mechanics tied to the narrative.", pt: "Roteiro de jogo: atos, fases, quests, encontros e diálogos, com mecânicas ligadas à narrativa." }
include: [nucleo]
units: { en: [Game, Act, Level, Quest, Encounter, Dialogue], pt: [Jogo, Ato, Fase, Quest, Encontro, Diálogo] }
templateUnit: Quest
suggestedTemplates: [jornada_do_heroi, quest_jogo, tres_atos]
nodeTypes:
  - name: { en: Mechanic, pt: Mecânica }
    base: Ability
    attributes:
      - { key: { en: how_it_works, pt: descricao }, label: { en: How it works, pt: Como funciona }, dataType: text_long }
      - { key: { en: narrative_reason, pt: justificativa_narrativa }, label: { en: Narrative justification, pt: Justificativa narrativa }, dataType: text_long }
  - name: { en: Game, pt: Jogo }
    base: Unit
    attributes:
      - { key: { en: premise, pt: premissa }, label: { en: Premise, pt: Premissa }, dataType: text_long, defaultCriticality: critical }
      - { key: { en: genre, pt: genero }, label: { en: Genre, pt: Gênero }, dataType: string_short }
      - { key: { en: core_loop, pt: loop_principal }, label: { en: Core gameplay loop, pt: Loop principal de gameplay }, dataType: text_long }
  - name: { en: Act, pt: Ato }
    base: Unit
  - name: { en: Level, pt: Fase }
    base: Unit
    attributes:
      - { key: { en: map, pt: mapa }, label: { en: Map, pt: Mapa }, dataType: node_ref, refType: "@Place", role: location }
      - { key: { en: new_mechanic, pt: mecanica_nova }, label: { en: Mechanic introduced, pt: Mecânica introduzida }, dataType: node_ref, refType: { en: Mechanic, pt: Mecânica } }
  - name: Quest
    base: Unit
    attributes:
      - { key: { en: kind, pt: tipo }, label: { en: Kind, pt: Tipo }, dataType: enum, options: { en: [main, side, optional, event], pt: [principal, secundaria, opcional, evento] } }
      - { key: { en: objective, pt: objetivo }, label: { en: Objective, pt: Objetivo }, dataType: text_long }
      - { key: { en: reward, pt: recompensa }, label: { en: Reward, pt: Recompensa }, dataType: text_long }
      - { key: quest_giver, label: { en: Quest giver, pt: Quem dá a quest }, dataType: node_ref, refType: "@Agent" }
  - name: { en: Encounter, pt: Encontro }
    base: Unit
    attributes:
      - { key: { en: kind, pt: tipo }, label: { en: Kind, pt: Tipo }, dataType: enum,
          options: { en: [combat, puzzle, social, exploration, boss], pt: [combate, puzzle, social, exploracao, chefe] } }
      - { key: { en: difficulty, pt: dificuldade }, label: { en: Difficulty, pt: Dificuldade }, dataType: enum,
          options: { en: [easy, medium, hard, boss], pt: [facil, media, dificil, chefe] } }
  - name: { en: Dialogue, pt: Diálogo }
    base: Unit
    attributes:
      - { key: { en: lines, pt: falas }, label: { en: Lines, pt: Falas }, dataType: text_long, role: manuscript }
      - { key: { en: condition, pt: condicao }, label: { en: Condition to appear, pt: Condição para aparecer }, dataType: string_short }
  - name: { en: Enemy, pt: Inimigo }
    base: Agent
    attributes:
      - { key: { en: behavior, pt: comportamento }, label: { en: Behavior, pt: Comportamento }, dataType: text_long }
      - { key: { en: weakness, pt: fraqueza }, label: { en: Weakness, pt: Fraqueza }, dataType: string_short, defaultCriticality: critical }
relTypes:
  - { name: { en: LEADS_TO, pt: LEVA_A }, base: CAUSAL, description: { en: "Progression: completing one unit leads to another.", pt: "Progressão: conclusão leva a outra unidade." },
      allowed: [{ from: "@Unit", to: "@Unit" }] }
  - { name: { en: INHABITS, pt: HABITA }, base: SPATIAL, allowed: [{ from: { en: Enemy, pt: Inimigo }, to: "@Place" }] }
directives:
  - id: jogo-mecanica
    text: { en: "New mechanics need a reason in the world (ludonarrative): if the player gains a power, the story explains where it came from.",
            pt: "Mecânicas novas devem ter justificativa no mundo (ludonarrativa): se o jogador ganha um poder, a história explica de onde ele veio." }
    when: [context, write]
    bases: [Ability]
    priority: 4
  - id: jogo-objetivo
    text: { en: "Every quest needs an objective the player can state in one sentence and a reward consistent with the world.",
            pt: "Toda quest precisa de objetivo claro para o jogador em uma frase e de recompensa coerente com o mundo." }
    when: [context]
    types: [Quest]
    priority: 5
