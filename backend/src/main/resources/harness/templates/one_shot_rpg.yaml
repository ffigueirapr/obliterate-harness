id: one_shot_rpg
name: { en: RPG adventure (one-shot), pt: Aventura de RPG (one-shot) }
description: { en: "A self-contained adventure in one or a few sessions: hook, investigation, encounters, reveal and confrontation.",
               pt: "Uma aventura fechada em uma ou poucas sessões: gancho, investigação, encontros, revelação e confronto." }
scope: obra
media: [rpg_mesa]
source: { en: "Common structure of published adventures (synthesis)", pt: "Estrutura comum de aventuras prontas (síntese)" }
beats:
  - { key: { en: hook, pt: gancho }, name: { en: Opening hook, pt: Gancho inicial }, position: 0.0,
      function: { en: "A reason for the party to get involved.", pt: "Motivo para o grupo se envolver." }, criteria: { en: "A hook that speaks to the motivation of at least one player character.", pt: "Gancho que conversa com a motivação de pelo menos um personagem jogador." } }
  - { key: { en: investigation, pt: investigacao }, name: { en: Investigation, pt: Investigação }, position: 0.2,
      function: { en: "Clues and NPCs that point the way.", pt: "Pistas e NPCs que apontam caminhos." }, criteria: { en: "At least three clues for the main conclusion (three-clue rule).", pt: "Ao menos três pistas para a conclusão principal (regra das três pistas)." } }
  - { key: { en: first_encounter, pt: primeiro_encontro }, name: { en: First encounter, pt: Primeiro encontro }, position: 0.35,
      function: { en: "The first real risk.", pt: "Primeiro risco real." }, criteria: { en: "A challenge that shows the adventure's tone and danger.", pt: "Desafio que mostra o tom e o perigo da aventura." } }
  - { key: { en: reveal, pt: revelacao }, name: { en: Reveal, pt: Revelação }, position: 0.55,
      function: { en: "The truth about the threat or the villain.", pt: "A verdade sobre a ameaça ou o vilão." }, criteria: { en: "Changes what the party knows and what they must do.", pt: "Muda o que o grupo sabe e o que precisa fazer." } }
  - { key: { en: escalation, pt: escalada }, name: { en: Escalation, pt: Escalada }, position: 0.7,
      function: { en: "The antagonist reacts; time runs short.", pt: "O antagonista reage; o tempo aperta." }, criteria: { en: "The consequences of the party's actions show up.", pt: "Consequência das ações do grupo aparece." } }
  - { key: { en: confrontation, pt: confronto }, name: { en: Final confrontation, pt: Confronto final }, position: 0.9,
      function: { en: "The decisive showdown.", pt: "Enfrentamento decisivo." }, criteria: { en: "More than one way to win (force, cunning, diplomacy).", pt: "Mais de uma forma de resolver (força, astúcia, diplomacia)." } }
  - { key: { en: aftermath, pt: desfecho }, name: { en: Aftermath and rewards, pt: Desfecho e recompensas }, position: 1.0,
      function: { en: "Consequences, rewards and future hooks.", pt: "Consequências, recompensas e ganchos futuros." }, criteria: { en: "The world reacts to the outcome; a hook for the next one remains.", pt: "Mundo reage ao resultado; fica um gancho para a próxima." } }
