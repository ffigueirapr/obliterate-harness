id: manga
name: { en: Manga / comics, pt: Mangá / HQ }
description: { en: "Visual script: chapters, pages and panels, with framing, dialogue and page-turn pacing.", pt: "Roteiro visual: capítulos, páginas e painéis, com enquadramento, falas e ritmo de virada de página." }
include: [nucleo]
units: { en: [Series, Volume, Chapter, Page, Panel], pt: [Série, Volume, Capítulo, Página, Painel] }
templateUnit: { en: Chapter, pt: Capítulo }
suggestedTemplates: [kishotenketsu, capitulo_serial, jornada_do_heroi]
nodeTypes:
  - name: { en: Series, pt: Série }
    base: Unit
    attributes:
      - { key: { en: premise, pt: premissa }, label: { en: Premise, pt: Premissa }, dataType: text_long, defaultCriticality: critical }
      - { key: { en: demographic, pt: demografia }, label: { en: Demographic, pt: Demografia }, dataType: enum,
          options: { en: [shounen, shoujo, seinen, josei, kodomo, general], pt: [shounen, shoujo, seinen, josei, kodomo, geral] } }
  - name: Volume
    base: Unit
  - name: { en: Chapter, pt: Capítulo }
    base: Unit
    attributes:
      - { key: status, label: Status, dataType: enum, options: { en: [idea, script, storyboard, art, done], pt: [ideia, roteiro, storyboard, arte, pronto] } }
      - { key: { en: planned_pages, pt: paginas_previstas }, label: { en: Planned pages, pt: Páginas previstas }, dataType: int }
  - name: { en: Page, pt: Página }
    base: Unit
    attributes:
      - { key: { en: side, pt: lado }, label: { en: Side, pt: Lado }, dataType: enum, options: { en: [left, right, spread], pt: [esquerda, direita, dupla] } }
      - { key: { en: page_turn, pt: virada }, label: { en: Page turn (reveal), pt: Virada de página (revelação) }, dataType: text_long }
  - name: { en: Panel, pt: Painel }
    base: Unit
    attributes:
      - { key: { en: framing, pt: enquadramento }, label: { en: Framing, pt: Enquadramento }, dataType: enum,
          options: { en: [wide, medium, close_up, extreme_close_up, detail, splash], pt: [plano_geral, plano_medio, close, super_close, plano_detalhe, splash] } }
      - { key: { en: description, pt: descricao }, label: { en: Visual description, pt: Descrição visual }, dataType: text_long }
      - { key: { en: dialogue, pt: falas }, label: { en: Dialogue, pt: Falas }, dataType: text_long, role: manuscript }
      - { key: { en: sfx, pt: onomatopeias }, label: { en: Sound effects, pt: Onomatopeias }, dataType: string_short }
directives:
  - id: manga-virada
    text: { en: "Strong reveals work best at the top of a left page (right after the turn); plan pacing by the page, not by the sentence.",
            pt: "Revelações fortes funcionam melhor no início de uma página da esquerda (depois da virada); planeje o ritmo pela página, não pela frase." }
    when: [context]
    types: { en: [Page, Chapter], pt: [Página, Capítulo] }
    priority: 4
  - id: manga-painel
    text: { en: "Each panel should hold one clear action; short lines fit balloons better.", pt: "Cada painel deve ter uma única ação clara; falas curtas cabem melhor nos balões." }
    when: [context]
    types: { en: [Panel], pt: [Painel] }
    priority: 3
