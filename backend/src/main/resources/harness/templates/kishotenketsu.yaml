id: kishotenketsu
name: Kishōtenketsu
description: { en: "Four beats (introduction, development, twist, conclusion), without relying on a central conflict. Common in manga and light novels.",
               pt: "Quatro tempos (introdução, desenvolvimento, virada, conclusão), sem depender de conflito central. Comum em mangá e light novel." }
scope: obra
media: [manga, light_novel, livro, visual_novel]
source: { en: "Traditional structure of Chinese and Japanese poetry and narrative", pt: "Estrutura tradicional da poesia e narrativa chinesa e japonesa" }
beats:
  - { key: ki, name: { en: Ki (introduction), pt: Ki (introdução) }, position: 0.0,
      function: { en: "Introduces characters, place and situation.", pt: "Apresenta personagens, lugar e situação." },
      criteria: { en: "The reader understands the setting and who is in it.", pt: "O leitor entende o cenário e quem está nele." } }
  - { key: sho, name: { en: Shō (development), pt: Shō (desenvolvimento) }, position: 0.3,
      function: { en: "Deepens the situation without major changes.", pt: "Aprofunda a situação sem grandes mudanças." },
      criteria: { en: "Relationships and details develop; expectation builds.", pt: "Desenvolve relações e detalhes; expectativa se forma." } }
  - { key: ten, name: { en: Ten (twist), pt: Ten (virada) }, position: 0.6,
      function: { en: "An unexpected element, sometimes seemingly unrelated, that changes how the whole reads.", pt: "Elemento inesperado, às vezes aparentemente desconexo, que muda a leitura do todo." },
      criteria: { en: "There is a surprise or a change of perspective.", pt: "Há uma surpresa ou mudança de perspectiva." } }
  - { key: ketsu, name: { en: Ketsu (conclusion), pt: Ketsu (conclusão) }, position: 1.0,
      function: { en: "Reconciles the twist with the rest and closes.", pt: "Reconcilia a virada com o resto e fecha." },
      criteria: { en: "The twist makes sense together with the earlier parts.", pt: "A virada ganha sentido junto com as partes anteriores." } }
