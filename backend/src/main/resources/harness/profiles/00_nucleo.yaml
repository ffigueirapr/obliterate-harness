# Core shared by every profile: characters, world, hooks and the template kit.
# Bilingual: any text may be {en: ..., pt: ...}. Keep the same order of items/options in both languages.
# systemKey marks what the harness engine relies on (template, beat, thread, appears_in, plants, pays, about...).
id: nucleo
name: { en: Core, pt: Núcleo }
description: { en: Types common to any story., pt: Tipos comuns a qualquer história. }
abstract: true

objectTypes: []

nodeTypes:
  - name: { en: Character, pt: Personagem }
    base: Agent
    description: { en: Any person or creature with a will of its own in the story., pt: Qualquer pessoa ou criatura com vontade própria na história. }
    attributes:
      - { key: { en: role, pt: papel }, label: { en: Role, pt: Papel }, dataType: enum,
          options: { en: [protagonist, antagonist, supporting, mentor, extra], pt: [protagonista, antagonista, coadjuvante, mentor, figurante] } }
      - { key: status, label: Status, dataType: enum, options: { en: [alive, dead, missing, unknown], pt: [vivo, morto, desaparecido, desconhecido] } }
      - { key: { en: age, pt: idade }, label: { en: Age, pt: Idade }, dataType: int }
      - { key: { en: origin, pt: origem }, label: { en: Origin, pt: Origem }, dataType: node_ref, refType: "@Place",
          description: { en: "Place they come from; brings culture and customs as background.", pt: "Lugar de onde veio; puxa cultura e costumes como pano de fundo." } }
      - { key: { en: appearance, pt: aparencia }, label: { en: Appearance, pt: Aparência }, dataType: text_long }
      - { key: { en: personality, pt: personalidade }, label: { en: Personality, pt: Personalidade }, dataType: text_long }
      - { key: { en: voice, pt: voz }, label: { en: Voice / way of speaking, pt: Voz / jeito de falar }, dataType: string_short }
      - { key: { en: motivation, pt: motivacao }, label: { en: Motivation, pt: Motivação }, dataType: text_long }
      - { key: { en: goal, pt: objetivo }, label: { en: Goal, pt: Objetivo }, dataType: text_long }
      - { key: { en: fear, pt: medo }, label: { en: Fear / wound, pt: Medo / ferida }, dataType: text_long }
      - { key: { en: secret, pt: segredo }, label: { en: Secret, pt: Segredo }, dataType: text_long, role: secret }
      - { key: { en: arc, pt: arco }, label: { en: Transformation arc, pt: Arco de transformação }, dataType: text_long }
  - name: { en: Faction, pt: Facção }
    base: Agent
    description: { en: "Organized group (guild, family, company, cult, army).", pt: "Grupo organizado (guilda, família, empresa, culto, exército)." }
    attributes:
      - { key: { en: ideology, pt: ideologia }, label: { en: Ideology, pt: Ideologia }, dataType: text_long }
      - { key: { en: leader, pt: lider }, label: { en: Leader, pt: Líder }, dataType: node_ref, refType: { en: Character, pt: Personagem } }
      - { key: { en: reach, pt: alcance }, label: { en: Reach, pt: Alcance }, dataType: enum, options: { en: [local, regional, global], pt: [local, regional, global] } }
      - { key: { en: resources, pt: recursos }, label: { en: Resources, pt: Recursos }, dataType: text_long }
  - name: { en: Place, pt: Lugar }
    base: Place
    attributes:
      - { key: { en: kind, pt: tipo }, label: { en: Kind, pt: Tipo }, dataType: enum,
          options: { en: [continent, region, city, village, building, room, nature, point_of_interest, other],
                     pt: [continente, regiao, cidade, vila, construcao, comodo, natureza, ponto_de_interesse, outro] } }
      - { key: { en: inside, pt: dentro_de }, label: { en: Inside, pt: Dentro de }, dataType: node_ref, refType: "@Place" }
      - { key: { en: climate, pt: clima }, label: { en: Climate, pt: Clima }, dataType: string_short }
      - { key: { en: population, pt: populacao }, label: { en: Population / density, pt: População / densidade }, dataType: string_short }
      - { key: { en: government, pt: governo }, label: { en: Government / leadership, pt: Governo / liderança }, dataType: text_long }
      - { key: { en: sensory_description, pt: descricao_sensorial }, label: { en: Sensory description, pt: Descrição sensorial }, dataType: text_long }
  - name: Item
    base: Object
    attributes:
      - { key: { en: kind, pt: tipo }, label: { en: Kind, pt: Tipo }, dataType: string_short }
      - { key: { en: effect, pt: efeito }, label: { en: Effect / purpose, pt: Efeito / função }, dataType: text_long }
      - { key: { en: rules_of_use, pt: regras_de_uso }, label: { en: Rules of use, pt: Regras de uso }, dataType: text_long, defaultCriticality: critical }
  - name: { en: Ability, pt: Habilidade }
    base: Ability
    description: { en: "Power, magic, technique or mechanic an agent can use.", pt: "Poder, magia, técnica ou mecânica que um agente pode usar." }
    attributes:
      - { key: { en: effect, pt: efeito }, label: { en: Effect, pt: Efeito }, dataType: text_long }
      - { key: { en: cost, pt: custo }, label: { en: Cost, pt: Custo }, dataType: text_long, defaultCriticality: foundational }
      - { key: { en: conditions, pt: condicoes }, label: { en: Conditions of use, pt: Condições de uso }, dataType: text_long, defaultCriticality: foundational }
      - { key: { en: limits, pt: limites }, label: { en: Limits, pt: Limites }, dataType: text_long, defaultCriticality: foundational }
  - name: { en: Culture, pt: Cultura }
    base: Concept
    description: { en: "Customs of a people or place. Background, not law — characters may break from it.", pt: "Costumes de um povo ou lugar. Pano de fundo, não lei — personagens podem fugir dela." }
    attributes:
      - { key: { en: customs, pt: costumes }, label: { en: Customs, pt: Costumes }, dataType: text_long }
      - { key: { en: values, pt: valores }, label: { en: Values, pt: Valores }, dataType: text_long }
      - { key: { en: typical_appearance, pt: aparencia_tipica }, label: { en: Typical appearance, pt: Aparência típica }, dataType: text_long }
      - { key: { en: language, pt: lingua }, label: { en: Language / accent, pt: Língua / sotaque }, dataType: string_short }
      - { key: { en: beliefs, pt: crencas }, label: { en: Beliefs, pt: Crenças }, dataType: text_long }
  - name: { en: System, pt: Sistema }
    base: Concept
    description: { en: "A rule system of the world (magic, technology, economy, politics).", pt: "Sistema de regras do mundo (magia, tecnologia, economia, política)." }
    attributes:
      - { key: { en: rules, pt: regras }, label: { en: Rules, pt: Regras }, dataType: text_long, defaultCriticality: foundational }
      - { key: { en: exceptions, pt: excecoes }, label: { en: Known exceptions, pt: Exceções conhecidas }, dataType: text_long }
  - name: { en: Event, pt: Evento }
    base: Event
    attributes:
      - { key: { en: when, pt: quando }, label: { en: When (in the world), pt: Quando (no mundo) }, dataType: story_time }
      - { key: { en: consequences, pt: consequencias }, label: { en: Consequences, pt: Consequências }, dataType: text_long }
  - name: { en: Hook, pt: Gancho }
    base: Device
    systemKey: thread
    description: { en: "A setup that asks for a payoff — foreshadowing, Chekhov's gun, mystery, promise to the reader.", pt: "Setup que pede payoff — foreshadowing, arma de Chekhov, mistério, promessa ao leitor." }
    attributes:
      - { key: { en: kind, pt: tipo }, label: { en: Kind, pt: Tipo }, dataType: enum,
          options: { en: [foreshadowing, chekhovs_gun, mystery, promise, red_herring, cliffhanger, subplot],
                     pt: [foreshadowing, arma_de_chekhov, misterio, promessa, red_herring, cliffhanger, subtrama] } }
      - { key: status, label: Status, dataType: enum, options: { en: [open, paid, abandoned], pt: [aberto, pago, abandonado] } }
      - { key: { en: planned_payoff, pt: payoff_planejado }, label: { en: Planned payoff, pt: Payoff planejado }, dataType: text_long }
  - name: Template
    base: Note
    systemKey: template
    description: { en: Narrative structure applied to the project (created by the harness)., pt: Estrutura narrativa aplicada ao projeto (criado pelo harness). }
    attributes:
      - { key: template_id, label: { en: Source template, pt: Template de origem }, dataType: string_short }
      - { key: { en: unit_type, pt: tipo_de_unidade }, label: { en: Measured unit, pt: Unidade medida }, dataType: string_short }
      - { key: { en: planned_units, pt: unidades_planejadas }, label: { en: Planned units, pt: Unidades planejadas }, dataType: int }
      - { key: { en: scope, pt: escopo }, label: { en: "Scope (id of the unit whose parts the template measures)", pt: "Escopo (id da unidade cujas partes o template mede)" }, dataType: string_short }
      - { key: { en: source, pt: fonte }, label: { en: Source, pt: Fonte }, dataType: string_short }
  - name: Beat
    base: Note
    systemKey: beat
    description: { en: "A template milestone, with its expected position in the work.", pt: "Marco de um template, com posição esperada na obra." }
    attributes:
      - { key: { en: key, pt: chave }, label: { en: Key, pt: Chave }, dataType: string_short }
      - { key: { en: position, pt: posicao }, label: { en: Expected position (0 to 1), pt: Posição esperada (0 a 1) }, dataType: decimal }
      - { key: { en: function, pt: funcao }, label: { en: Dramatic function, pt: Função dramática }, dataType: text_long }
      - { key: { en: criteria, pt: criterio }, label: { en: Acceptance criteria, pt: Critério de aceite }, dataType: text_long }
      - { key: { en: devices, pt: recursos }, label: { en: Expected devices, pt: Recursos esperados }, dataType: list, itemType: string_short }
      - { key: { en: required, pt: obrigatorio }, label: { en: Required, pt: Obrigatório }, dataType: bool }

relTypes:
  - { name: { en: ALLY_OF, pt: ALIADO_DE }, base: SOCIAL, symmetric: true, allowed: [{ from: "@Agent", to: "@Agent" }] }
  - { name: { en: ENEMY_OF, pt: INIMIGO_DE }, base: SOCIAL, symmetric: true, allowed: [{ from: "@Agent", to: "@Agent" }] }
  - { name: { en: FAMILY_OF, pt: FAMÍLIA_DE }, base: SOCIAL, symmetric: true,
      description: { en: "Use the description for the degree (brother, mother...).", pt: "Use a descrição para o grau (irmão, mãe...)." }, allowed: [{ from: "@Agent", to: "@Agent" }] }
  - { name: { en: RELATES_TO, pt: RELACIONA_COM }, base: SOCIAL,
      description: { en: "Generic relation; describe its nature (love, rivalry, debt...).", pt: "Relação genérica; descreva a natureza (amor, rivalidade, dívida...)." }, allowed: [{ from: "@Agent", to: "@Agent" }] }
  - { name: { en: MEMBER_OF, pt: MEMBRO_DE }, base: SOCIAL, inverseName: { en: has as member, pt: tem como membro }, allowed: [{ from: "@Agent", to: { en: Faction, pt: Facção } }] }
  - { name: { en: OWNS, pt: POSSUI }, base: POSSESSION, inverseName: { en: belongs to, pt: pertence a }, allowed: [{ from: "@Agent", to: "@Object" }, { from: "@Place", to: "@Object" }] }
  - { name: { en: MASTERS, pt: DOMINA }, base: POSSESSION, description: { en: The agent can use the ability., pt: Agente sabe usar a habilidade. },
      allowed: [{ from: "@Agent", to: "@Ability" }, { from: "@Object", to: "@Ability" }] }
  - { name: { en: LOCATED_IN, pt: ESTÁ_EM }, base: SPATIAL, systemKey: located_in,
      description: { en: "Location (use anchors for changes over time).", pt: "Localização (use âncoras para mudanças no tempo)." }, allowed: [{ from: "*", to: "@Place" }] }
  - { name: { en: CONNECTS_TO, pt: CONECTA_A }, base: SPATIAL, symmetric: true,
      description: { en: "Way between places (road, door, route).", pt: "Caminho entre lugares (estrada, porta, rota)." }, allowed: [{ from: "@Place", to: "@Place" }] }
  - { name: { en: CULTURE_OF, pt: CULTURA_DE }, base: ORIGIN, description: { en: Prevailing culture of a place or faction., pt: Cultura predominante de um lugar ou facção. },
      allowed: [{ from: { en: Culture, pt: Cultura }, to: "@Place" }, { from: { en: Culture, pt: Cultura }, to: { en: Faction, pt: Facção } }] }
  - { name: { en: FOLLOWS, pt: SEGUE }, base: ORIGIN, description: { en: "The agent follows a culture or system (as background).", pt: "Agente segue uma cultura ou sistema (como pano de fundo)." },
      allowed: [{ from: "@Agent", to: "@Concept" }] }
  - { name: { en: KNOWS, pt: SABE }, base: KNOWLEDGE, description: { en: "The agent knows something (use fromUnit for when they learned it).", pt: "Agente sabe de algo (use fromUnit para quando descobriu)." },
      allowed: [{ from: "@Agent", to: "*" }] }
  - { name: { en: APPEARS_IN, pt: APARECE_EM }, base: PARTICIPATION, systemKey: appears_in, allowed: [{ from: "*", to: "@Unit" }] }
  - { name: { en: HAPPENS_IN, pt: ACONTECE_EM }, base: PARTICIPATION, allowed: [{ from: "@Event", to: "@Unit" }] }
  - { name: { en: CAUSES, pt: CAUSA }, base: CAUSAL, inverseName: { en: is caused by, pt: é causado por }, allowed: [{ from: "*", to: "@Event" }, { from: "@Event", to: "*" }] }
  - { name: { en: PLANTS, pt: PLANTA }, base: SETUP_PAYOFF, systemKey: plants,
      description: { en: "Unit where a hook or a clue is planted (any node can be a clue).", pt: "Unidade onde um gancho ou pista é plantado (qualquer nó pode ser pista)." },
      allowed: [{ from: "@Unit", to: "@Device" }, { from: "@Unit", to: "*" }] }
  - { name: { en: PAYS_OFF, pt: PAGA }, base: SETUP_PAYOFF, systemKey: pays,
      description: { en: Unit where the hook or clue pays off., pt: Unidade onde o gancho ou pista é pago. },
      allowed: [{ from: "@Unit", to: "@Device" }, { from: "@Unit", to: "*" }] }
  - { name: { en: ABOUT, pt: SOBRE }, base: REFERENCE, systemKey: about,
      description: { en: "What a hook is about (people, items, places involved).", pt: "Do que trata um gancho (pessoas, itens, lugares envolvidos)." },
      allowed: [{ from: "@Device", to: "*" }] }
  - { name: { en: MAPS_TO_BEAT, pt: MAPEIA_BEAT }, base: REFERENCE, systemKey: maps_to_beat,
      description: { en: The unit fulfills this template beat., pt: A unidade cumpre este beat do template. }, allowed: [{ from: "@Unit", to: Beat }] }
  - { name: { en: BEAT_OF, pt: BEAT_DE }, base: REFERENCE, systemKey: beat_of, allowed: [{ from: Beat, to: Template }] }

directives:
  - id: nucleo-ler-antes
    text: { en: "Before creating a character, place or item, check with node_search whether it already exists.", pt: "Antes de criar personagem, lugar ou item, procure com node_search se já existe." }
    when: [write]
    priority: 5
  - id: nucleo-cultura-pano-de-fundo
    text: { en: "Culture and customs are background (norm), not law. If a character breaks from their origin's customs, the narrative should show or justify it.",
            pt: "Cultura e costumes são pano de fundo (norma), não lei. Se um personagem foge do costume da origem, a narrativa deve mostrar ou justificar." }
    when: [context]
    bases: [Agent]
    priority: 3
  - id: nucleo-registrar-estado
    text: { en: "When you finish a unit, record what changed (possession, knowledge, location, relations) with fromUnit/toUnit anchors, set its cast, and mark hooks/clues with PLANTS/PAYS_OFF.",
            pt: "Ao terminar uma unidade, registre o que mudou (posse, conhecimento, local, relações) com âncoras fromUnit/toUnit, defina o elenco (cast) e marque ganchos/pistas com PLANTA/PAGA." }
    when: [context, write]
    priority: 4
