id: publicidade
name: { en: Advertising, pt: Publicidade }
description: { en: "Campaigns and pieces: brief, persona, key message, spots and shots, with brand guidelines as law.", pt: "Campanhas e peças: briefing, persona, mensagem-chave, spots e shots, com diretrizes de marca como lei." }
include: [nucleo]
units: { en: [Campaign, Piece, Spot, Shot], pt: [Campanha, Peça, Spot, Shot] }
templateUnit: Shot
suggestedTemplates: [spot_publicitario]
nodeTypes:
  - name: Persona
    base: Agent
    attributes:
      - { key: { en: pains, pt: dores }, label: { en: Pains, pt: Dores }, dataType: text_long }
      - { key: { en: desires, pt: desejos }, label: { en: Desires, pt: Desejos }, dataType: text_long }
      - { key: { en: context, pt: contexto }, label: { en: Context of use, pt: Contexto de uso }, dataType: text_long }
  - name: { en: Product, pt: Produto }
    base: Object
    attributes:
      - { key: { en: main_benefit, pt: beneficio_principal }, label: { en: Main benefit, pt: Benefício principal }, dataType: text_long, defaultCriticality: critical }
      - { key: { en: proof, pt: provas }, label: { en: Proof / differentiators, pt: Provas / diferenciais }, dataType: text_long }
  - name: { en: Key message, pt: Mensagem-chave }
    base: Concept
    attributes:
      - { key: { en: line, pt: frase }, label: { en: Line, pt: Frase }, dataType: string_short, defaultCriticality: foundational }
  - name: { en: Brand guideline, pt: Diretriz de marca }
    base: Concept
    description: { en: "Brand rules: tone of voice, what never to say, logo and color use.", pt: "Regras da marca: tom de voz, o que nunca dizer, uso de logo e cores." }
    attributes:
      - { key: { en: rules, pt: regras }, label: { en: Rules, pt: Regras }, dataType: text_long, defaultCriticality: foundational }
  - name: { en: Campaign, pt: Campanha }
    base: Unit
    attributes:
      - { key: { en: brief, pt: briefing }, label: { en: Brief, pt: Briefing }, dataType: text_long, defaultCriticality: critical }
      - { key: { en: business_goal, pt: objetivo }, label: { en: Business goal, pt: Objetivo de negócio }, dataType: text_long }
      - { key: kpi, label: KPI, dataType: string_short }
  - name: { en: Piece, pt: Peça }
    base: Unit
    attributes:
      - { key: { en: channel, pt: canal }, label: { en: Channel, pt: Canal }, dataType: enum,
          options: { en: [tv, youtube, instagram, tiktok, radio, ooh, podcast, other], pt: [tv, youtube, instagram, tiktok, radio, ooh, podcast, outro] } }
  - name: Spot
    base: Unit
    attributes:
      - { key: { en: duration_s, pt: duracao_seg }, label: { en: Duration (s), pt: Duração (s) }, dataType: int }
      - { key: cta, label: { en: Call to action, pt: Chamada para ação }, dataType: string_short, defaultCriticality: critical }
      - { key: { en: script, pt: roteiro }, label: { en: Script, pt: Roteiro }, dataType: text_long, role: manuscript }
  - name: Shot
    base: Unit
    attributes:
      - { key: { en: seconds, pt: segundos }, label: { en: "Time (from-to, in s)", pt: "Tempo (de-até, em s)" }, dataType: string_short }
      - { key: { en: image, pt: imagem }, label: { en: Image, pt: Imagem }, dataType: text_long }
      - { key: { en: audio, pt: audio }, label: { en: Audio / voice-over, pt: Áudio / locução }, dataType: text_long }
      - { key: lettering, label: Lettering, dataType: string_short }
relTypes:
  - { name: { en: SPEAKS_TO, pt: FALA_COM }, base: SOCIAL, allowed: [{ from: "@Unit", to: Persona }] }
  - { name: { en: CONVEYS, pt: COMUNICA }, base: REFERENCE,
      allowed: [{ from: "@Unit", to: { en: Key message, pt: Mensagem-chave } }, { from: "@Unit", to: { en: Product, pt: Produto } }] }
directives:
  - id: ads-marca
    text: { en: "Brand guidelines are law: no piece may contradict them.", pt: "Diretrizes de marca são lei: nenhuma peça pode contrariá-las." }
    when: [always]
    priority: 9
  - id: ads-gancho
    text: { en: "The first 3 seconds must grab attention; the brand must show before the end and the CTA must be explicit.",
            pt: "Os primeiros 3 segundos precisam prender atenção; a marca deve aparecer antes do fim e o CTA tem que ser explícito." }
    when: [context]
    types: [Spot, Shot]
    priority: 6
