id: tres_atos
name: { en: Three acts, pt: Três atos }
description: { en: "Classic structure: setup, confrontation and resolution, with two turning points and a midpoint.", pt: "Estrutura clássica: preparação, confronto e resolução, com dois pontos de virada e um ponto médio." }
scope: obra
media: [livro, filme_serie, jogo, visual_novel, rpg_mesa, light_novel]
source: { en: "Classic dramatic structure (Aristotle; formalized for screenwriting by Syd Field)", pt: "Estrutura dramática clássica (Aristóteles; formalizada para roteiro por Syd Field)" }
beats:
  - key: { en: setup, pt: preparacao }
    name: { en: Setup, pt: Preparação }
    position: 0.0
    function: { en: "Introduces the ordinary world, the protagonist, what they want and what they lack.", pt: "Apresenta o mundo comum, o protagonista, o que ele quer e o que lhe falta." }
    criteria: { en: "The reader knows who the protagonist is, where they are and what is at stake for them.", pt: "O leitor sabe quem é o protagonista, onde está e o que está em jogo para ele." }
  - key: { en: inciting_incident, pt: incidente_incitante }
    name: { en: Inciting incident, pt: Incidente incitante }
    position: 0.12
    function: { en: "An event breaks the balance and creates the central problem.", pt: "Um evento quebra o equilíbrio e cria o problema central." }
    criteria: { en: "There is a concrete event the protagonist cannot ignore.", pt: "Há um acontecimento concreto que o protagonista não pode ignorar." }
  - key: { en: first_turn, pt: primeira_virada }
    name: { en: First turning point, pt: Primeira virada }
    position: 0.25
    function: { en: "The protagonist commits to the goal; the story changes direction.", pt: "O protagonista se compromete com o objetivo; a história muda de direção." }
    criteria: { en: "An active decision by the protagonist takes them into new territory with no easy way back.", pt: "Decisão ativa do protagonista que o leva a um território novo e sem volta fácil." }
  - key: { en: midpoint, pt: ponto_medio }
    name: { en: Midpoint, pt: Ponto médio }
    position: 0.5
    function: { en: "A reveal or twist that changes the nature of the conflict or the goal.", pt: "Revelação ou virada que muda a natureza do conflito ou do objetivo." }
    criteria: { en: "Something changes the protagonist's understanding, or the stakes visibly rise.", pt: "Algo muda o entendimento do protagonista ou as apostas sobem visivelmente." }
  - key: { en: second_turn, pt: segunda_virada }
    name: { en: Second turning point, pt: Segunda virada }
    position: 0.75
    function: { en: "Crisis: the protagonist loses what they had or learns the truth that pushes them to the climax.", pt: "Crise: o protagonista perde o que tinha ou descobre a verdade que o empurra ao clímax." }
    criteria: { en: "The protagonist is at their lowest point or facing a decisive choice.", pt: "O protagonista está no ponto mais baixo ou diante de uma escolha decisiva." }
  - key: { en: climax, pt: climax }
    name: { en: Climax, pt: Clímax }
    position: 0.9
    function: { en: "Final confrontation where the central conflict is decided.", pt: "Confronto final em que o conflito central é decidido." }
    criteria: { en: "The central conflict is resolved by the protagonist's action.", pt: "O conflito central se resolve por ação do protagonista." }
  - key: { en: resolution, pt: resolucao }
    name: { en: Resolution, pt: Resolução }
    position: 1.0
    function: { en: "Shows the new balance and the cost of the journey.", pt: "Mostra o novo equilíbrio e o custo da jornada." }
    criteria: { en: "It is clear what changed in the world and in the protagonist; main hooks paid off.", pt: "Fica claro o que mudou no mundo e no protagonista; ganchos principais pagos." }
