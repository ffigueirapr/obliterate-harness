id: rpg_mesa
name: { en: Tabletop RPG, pt: RPG de mesa }
description: { en: "Campaigns, sessions and encounters, with maps, NPCs, monsters and hooks for the players.", pt: "Campanhas, sessões e encontros, com mapas, NPCs, monstros e ganchos para os jogadores." }
include: [nucleo]
units: { en: [Campaign, Arc, Session, Encounter], pt: [Campanha, Arco, Sessão, Encontro] }
templateUnit: { en: Session, pt: Sessão }
suggestedTemplates: [one_shot_rpg, jornada_do_heroi, tres_atos]
objectTypes:
  - name: { en: Stat block, pt: Ficha }
    description: { en: "A creature's game stats (adapt to the system you play).", pt: "Atributos de jogo de uma criatura (adapte ao sistema que você usa)." }
    fields:
      - { key: { en: level, pt: nivel }, label: { en: Level / CR, pt: Nível / ND }, dataType: int }
      - { key: { en: hp, pt: pv }, label: { en: Hit points, pt: Pontos de vida }, dataType: int }
      - { key: { en: defense, pt: defesa }, label: { en: Defense, pt: Defesa }, dataType: int }
      - { key: { en: attacks, pt: ataques }, label: { en: Attacks, pt: Ataques }, dataType: text_long }
      - { key: { en: abilities, pt: habilidades }, label: { en: Special abilities, pt: Habilidades especiais }, dataType: text_long }
nodeTypes:
  - name: { en: Map, pt: Mapa }
    base: Media
    attributes:
      - { key: { en: file, pt: arquivo }, label: { en: File, pt: Arquivo }, dataType: media }
      - { key: { en: scale, pt: escala }, label: { en: Scale, pt: Escala }, dataType: string_short }
  - name: { en: Campaign, pt: Campanha }
    base: Unit
    attributes:
      - { key: { en: premise, pt: premissa }, label: { en: Premise, pt: Premissa }, dataType: text_long, defaultCriticality: critical }
      - { key: { en: game_system, pt: sistema_de_jogo }, label: { en: Game system, pt: Sistema de jogo }, dataType: string_short }
      - { key: { en: tone, pt: tom }, label: { en: Tone, pt: Tom }, dataType: string_short }
  - name: { en: Arc, pt: Arco }
    base: Unit
  - name: { en: Session, pt: Sessão }
    base: Unit
    attributes:
      - { key: { en: real_date, pt: data_real }, label: { en: Session date, pt: Data da sessão }, dataType: string_short }
      - { key: { en: what_happened, pt: resumo_do_que_aconteceu }, label: { en: What happened at the table, pt: O que aconteceu na mesa }, dataType: text_long, role: manuscript }
      - { key: status, label: Status, dataType: enum, options: { en: [planned, played], pt: [planejada, jogada] } }
  - name: { en: Encounter, pt: Encontro }
    base: Unit
    attributes:
      - { key: { en: kind, pt: tipo }, label: { en: Kind, pt: Tipo }, dataType: enum,
          options: { en: [combat, social, exploration, trap, riddle], pt: [combate, social, exploracao, armadilha, enigma] } }
      - { key: { en: location, pt: local }, label: { en: Location, pt: Local }, dataType: node_ref, refType: "@Place", role: location }
      - { key: { en: difficulty, pt: dificuldade }, label: { en: Difficulty, pt: Dificuldade }, dataType: enum,
          options: { en: [trivial, easy, medium, hard, deadly], pt: [trivial, facil, media, dificil, mortal] } }
  - name: { en: Monster, pt: Monstro }
    base: Agent
    attributes:
      - { key: { en: stats, pt: ficha }, label: { en: Stat block, pt: Ficha }, dataType: composite, objectType: { en: Stat block, pt: Ficha } }
      - { key: { en: behavior, pt: comportamento }, label: { en: Behavior / tactics, pt: Comportamento / táticas }, dataType: text_long }
      - { key: { en: habitat, pt: habitat }, label: Habitat, dataType: node_ref, refType: "@Place" }
relTypes:
  - { name: { en: MAPPED_ON, pt: MAPEADO_EM }, base: REFERENCE, allowed: [{ from: "@Place", to: { en: Map, pt: Mapa } }] }
  - { name: { en: FACES, pt: ENFRENTA }, base: PARTICIPATION, description: { en: A creature present in an encounter., pt: Criatura presente num encontro. },
      allowed: [{ from: "@Agent", to: { en: Encounter, pt: Encontro } }] }
directives:
  - id: rpg-agencia
    text: { en: "The players decide: prepare situations and NPC motivations, not fixed sequences. Offer at least two ways through each encounter.",
            pt: "Os jogadores decidem: prepare situações e motivações de NPCs, não sequências fixas. Ofereça ao menos dois caminhos por encontro." }
    when: [context]
    priority: 6
  - id: rpg-registro
    text: { en: "After each played session, record in the graph what actually happened at the table (decisions, deaths, items): it becomes canon.",
            pt: "Depois de cada sessão jogada, registre no grafo o que de fato aconteceu na mesa (decisões, mortes, itens): isso vira cânone." }
    when: [session, write]
    types: { en: [Session], pt: [Sessão] }
    priority: 5
