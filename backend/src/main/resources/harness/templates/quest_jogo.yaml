id: quest_jogo
name: { en: Game quest, pt: Quest de jogo }
description: { en: "Structure of a mission: hook, objective, obstacles, complication, climax and reward. Apply it over the encounters of one quest.",
               pt: "Estrutura de uma missão: gancho, objetivo, obstáculos, complicação, clímax e recompensa. Aplique sobre os encontros de uma quest." }
scope: unidade
media: [jogo, rpg_mesa]
source: { en: "Quest design (synthesis)", pt: "Design de quests (síntese)" }
beats:
  - { key: { en: hook, pt: gancho }, name: { en: Hook / quest giver, pt: Gancho / quest giver }, position: 0.0,
      function: { en: "Someone or something presents the mission.", pt: "Alguém ou algo apresenta a missão." }, criteria: { en: "A reason for the player to care, beyond the reward.", pt: "Motivo para o jogador se importar, além da recompensa." } }
  - { key: { en: objective, pt: objetivo }, name: { en: Clear objective, pt: Objetivo claro }, position: 0.1,
      function: { en: "The player knows what to do.", pt: "O jogador sabe o que fazer." }, criteria: { en: "The objective fits in one sentence and points where to go.", pt: "Objetivo cabe em uma frase e tem indicação de onde ir." } }
  - { key: { en: journey, pt: jornada }, name: { en: Journey and obstacles, pt: Jornada e obstáculos }, position: 0.35,
      function: { en: "Challenges that use the available mechanics.", pt: "Desafios que usam as mecânicas disponíveis." }, criteria: { en: "Variety of challenges (combat, exploration, social, puzzle).", pt: "Variedade de desafios (combate, exploração, social, puzzle)." } }
  - { key: { en: complication, pt: complicacao }, name: { en: Complication, pt: Complicação }, position: 0.6,
      function: { en: "Something changes the mission (betrayal, secret, dilemma).", pt: "Algo muda a missão (traição, segredo, dilema)." }, criteria: { en: "New information that changes the objective or the side.", pt: "Nova informação que muda o objetivo ou o lado." } }
  - { key: { en: climax, pt: climax }, name: { en: Climax / boss, pt: Clímax / chefe }, position: 0.85,
      function: { en: "The hardest challenge of the quest.", pt: "Desafio mais difícil da quest." }, criteria: { en: "Demands what the player learned in the quest.", pt: "Exige o que o jogador aprendeu na quest." } }
  - { key: { en: reward, pt: recompensa }, name: { en: Reward and consequence, pt: Recompensa e consequência }, position: 1.0,
      function: { en: "Close with a reward and an effect on the world.", pt: "Fechar com recompensa e efeito no mundo." }, criteria: { en: "A consistent reward and a visible change in the world or NPCs.", pt: "Recompensa coerente e mudança visível no mundo ou nos NPCs." } }
